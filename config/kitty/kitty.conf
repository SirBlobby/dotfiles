include ~/.local/state/blob/current/theme/kitty.conf


# Fonts
font_family      JetBrainsMono Nerd Font Regular
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        14.0
adjust_line_height 115%
disable_ligatures cursor


# Window
window_padding_width 18
hide_window_decorations no
background_opacity 1.0
background_blur 0
confirm_os_window_close 0
remember_window_size yes
initial_window_width  120c
initial_window_height 34c
inactive_text_alpha 0.85


# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}  {title}"


# Cursor
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0
cursor_trail 0


# Performance
sync_to_monitor yes
repaint_delay   8
input_delay     2
wheel_scroll_multiplier 3.0


# Bell
enable_audio_bell no
visual_bell_duration 0.1


# Scrollback
scrollback_lines 20000
